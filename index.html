<title>업무 대시보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: fixed left rail (sections) + working canvas; rail becomes a top tab strip on phones */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --sunk:#e9eef0; --line:#d5dde1;
  --ink:#1c2b33; --muted:#5d6f78; --faint:#8a9aa2;
  --brand:#1f4e5f; --brand-ink:#ffffff; --accent:#d9822b; --accent-soft:#fbeedd;
  --ok:#2f7d4f; --ok-soft:#e1f1e7; --warn:#b26a00; --warn-soft:#fdf0d9; --bad:#b4372f; --bad-soft:#f9e1de; --idle:#6b7a82; --idle-soft:#e8ecee; --run:#2563a6; --run-soft:#e0ecf8;
  --f-display:"Pretendard","Pretendard Variable","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Pretendard","Pretendard Variable","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"Pretendard","Pretendard Variable","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12191d; --surface:#1a2328; --sunk:#141c20; --line:#2c3a41;
  --ink:#e4ecef; --muted:#9db0b8; --faint:#6f838c;
  --brand:#7cc0d4; --brand-ink:#0d1a1f; --accent:#f0a352; --accent-soft:#3a2a17;
  --ok:#6cc690; --ok-soft:#173225; --warn:#e9b25a; --warn-soft:#382a12; --bad:#ef8a80; --bad-soft:#3b1e1b; --idle:#9aabb3; --idle-soft:#243035; --run:#8ab8ea; --run-soft:#1a2a3d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12191d; --surface:#1a2328; --sunk:#141c20; --line:#2c3a41;
  --ink:#e4ecef; --muted:#9db0b8; --faint:#6f838c;
  --brand:#7cc0d4; --brand-ink:#0d1a1f; --accent:#f0a352; --accent-soft:#3a2a17;
  --ok:#6cc690; --ok-soft:#173225; --warn:#e9b25a; --warn-soft:#382a12; --bad:#ef8a80; --bad-soft:#3b1e1b; --idle:#9aabb3; --idle-soft:#243035; --run:#8ab8ea; --run-soft:#1a2a3d;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--brand);color:var(--brand-ink);padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.mark{display:flex;flex-direction:column;gap:2px}
.mark small{font-size:11.5px;letter-spacing:.08em;opacity:.75}
.mark b{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{color:inherit;text-decoration:none;padding:9px 12px;border-radius:6px;font-weight:500;opacity:.82;display:flex;justify-content:space-between;align-items:center}
.nav a:hover{opacity:1;background:color-mix(in srgb,var(--brand-ink) 10%,transparent)}
.nav a.on{opacity:1;background:var(--brand-ink);color:var(--brand)}
.nav .cnt{font-family:var(--f-mono);font-size:12px}
.rail .today{margin-top:auto;font-size:12.5px;opacity:.8;font-family:var(--f-mono)}
main{padding-block:28px 60px;padding-left:max(16px,2.4vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.4vw);min-width:0;max-width:1240px;width:100%}
h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0;text-wrap:balance}
h3{font-size:14px;font-weight:600;margin:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.head p{margin:4px 0 0;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-mono);font-weight:500;font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi.alert b{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:18px}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row:hover .t{color:var(--brand)}
.row .d{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .d.late{color:var(--bad);font-weight:500}
.row .t{min-width:0}
.row .t small{display:block;color:var(--faint);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-예정{color:var(--idle);background:var(--idle-soft)}
.s-진행중{color:var(--run);background:var(--run-soft)}
.s-완료{color:var(--ok);background:var(--ok-soft)}
.s-보류{color:var(--warn);background:var(--warn-soft)}
.s-지연{color:var(--bad);background:var(--bad-soft)}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.pcard{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.pcard:first-child{border-top:0;padding-top:0}
.pcard .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pcard .top b{font-weight:600}
.pcard .meta{font-size:12.5px;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.time i{background:var(--accent)}
.barlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column}
.post{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.post:first-child{border-top:0;padding-top:0}
.post .by{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.post .by b{color:var(--ink);font-weight:600}
.post p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.tag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.공지{background:var(--accent-soft);color:var(--accent)}
.tag.요청{background:var(--bad-soft);color:var(--bad)}
.tag.회의록{background:var(--run-soft);color:var(--run)}
/* project detail */
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.ptabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;cursor:pointer}
.ptabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.facts div{background:var(--surface);padding:11px 14px;min-width:0}
.facts span{display:block;font-size:12px;color:var(--muted);letter-spacing:.02em}
.facts b{font-weight:500;overflow-wrap:anywhere}
.facts b.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.summary{margin:0 0 6px;color:var(--ink);max-width:70ch;white-space:pre-wrap}
.goals{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.out{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.out:first-child{border-top:0}
.out .lbl small{display:block;color:var(--faint);font-size:12px}
.step{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.step button{width:26px;height:26px;border:1px solid var(--line);background:var(--surface);border-radius:5px;cursor:pointer;line-height:1}
.step button:hover{border-color:var(--brand)}
.timeline{display:flex;flex-direction:column;gap:2px}
.month{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.month:first-child{border-top:0}
.month>b{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--muted)}
.month.now>b{color:var(--accent)}
.month .items{display:flex;flex-direction:column;gap:6px;min-width:0}
.titem{display:flex;gap:8px;align-items:center;flex-wrap:wrap;cursor:pointer}
.titem .nm{min-width:0;flex:1 1 180px}
.titem small{color:var(--faint);font-size:12px}
.notes{white-space:pre-wrap;margin:0;overflow-wrap:anywhere}
/* board */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;min-width:0}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col>header{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px}
.col>header .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.card:hover{border-color:var(--brand)}
.card .ct{font-weight:500;overflow-wrap:anywhere}
.card .cm{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.card .cm .late{color:var(--bad);font-weight:500}
.card .pj{font-size:11.5px;color:var(--brand);font-weight:600}
/* form + dialog */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,20,25,.45)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12.5px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;width:100%}
.fld textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.acts .r{display:flex;gap:8px;margin-left:auto}
.compose{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.compose .line{display:flex;gap:8px;flex-wrap:wrap}
.compose select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 10px;min-width:0}
.compose textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:9px 11px;min-height:80px;resize:vertical;width:100%}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:9px 12px;font-size:13px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px;font-size:13px;z-index:20}
.muted{color:var(--muted)}
@media (max-width:980px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;flex-direction:row;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
  .mark small,.rail .today{display:none}
  .mark b{font-size:16px;white-space:nowrap}
  .nav{flex-direction:row;gap:2px}
  .nav a{padding:6px 10px;white-space:nowrap}
  .nav .cnt{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 50px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .out{grid-template-columns:minmax(0,1fr) auto}.out .bar{grid-column:1/-1;order:3}
  .two{grid-template-columns:1fr}
}
@media (max-width:520px){.board{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
:root{--c-gray:#6b7a82;--c-blue:#2563a6;--c-green:#2f7d4f;--c-orange:#b26a00;--c-red:#b4372f;--c-purple:#6d4aa8;--c-teal:#127a74;--c-pink:#b03a73;--fs:14.5px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-gray:#9aabb3;--c-blue:#8ab8ea;--c-green:#6cc690;--c-orange:#e9b25a;--c-red:#ef8a80;--c-purple:#bba2ea;--c-teal:#6fd3c4;--c-pink:#f19ac2}}
:root[data-theme="dark"]{--c-gray:#9aabb3;--c-blue:#8ab8ea;--c-green:#6cc690;--c-orange:#e9b25a;--c-red:#ef8a80;--c-purple:#bba2ea;--c-teal:#6fd3c4;--c-pink:#f19ac2}
body{font-size:var(--fs)}
.pill{color:var(--pc,var(--c-gray));background:color-mix(in srgb,var(--pc,var(--c-gray)) 14%,transparent)}
.tagc{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:0 6px;border-radius:4px;margin-left:5px;color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,transparent);vertical-align:1px;white-space:nowrap}
.ic{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a{justify-content:flex-start;gap:9px}
.nav a .cnt{margin-left:auto}
.mark{flex-direction:row;align-items:center;gap:10px}
.mark .logo{width:34px;height:34px;border-radius:8px;background:color-mix(in srgb,var(--brand-ink) 16%,transparent);display:grid;place-items:center;flex:none}
.mark .logo .ic{width:19px;height:19px}
.mark>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.mark b{font-size:16px;line-height:1.3;word-break:keep-all}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
a.btn.pri{color:var(--brand-ink)}
.who{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;background:color-mix(in srgb,var(--brand-ink) 10%,transparent);margin-top:auto}
.who img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--sunk)}
.who div{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.who b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{font-size:11.5px;opacity:.75}
.rail .who:not([hidden])+.today{margin-top:8px}
.app.rail-light .who{background:var(--sunk)}
.mark a.logo{color:inherit;text-decoration:none}
.mark a.logo:hover{filter:brightness(1.08)}
.ini{font-weight:700;font-size:13px;letter-spacing:-.02em}
.bigav{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);overflow:hidden;flex:none}
.bigav .ic{width:32px;height:32px}.bigav .ini{font-size:22px}
.bigav img{width:100%;height:100%;object-fit:cover;display:block}
.bigav.avatar{background:var(--sunk);color:var(--ink)}
.crop{width:260px;height:260px;max-width:100%;border-radius:50%;overflow:hidden;position:relative;touch-action:none;cursor:grab;background:var(--sunk);box-shadow:0 0 0 1px var(--line),0 0 0 6px color-mix(in srgb,var(--brand) 18%,transparent)}
.crop.drag{cursor:grabbing}
.crop img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;user-select:none;pointer-events:none}
.zoomrow{display:flex;align-items:center;gap:10px;width:100%}
.zoomrow input{flex:1;accent-color:var(--brand)}
.mark .logo.avatar{border-radius:50%;overflow:hidden;width:40px;height:40px;background:var(--sunk);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand-ink) 35%,transparent)}
.mark .logo.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.app.rail-light .mark .logo.avatar{box-shadow:0 0 0 2px var(--line)}
@media (max-width:760px){.mark .logo.avatar{display:grid;width:30px;height:30px}}
.app.rail-light .rail{background:var(--surface);color:var(--ink);border-right:1px solid var(--line)}
.app.rail-light .nav a.on{background:var(--brand);color:var(--brand-ink)}
.app.rail-light .nav a:hover{background:var(--sunk)}
.app.rail-light .mark .logo{background:var(--brand);color:var(--brand-ink)}
.app.rail-light .mark b{color:var(--brand)}
.row{grid-template-columns:24px 78px minmax(0,1fr) auto;cursor:default}
.row .t{cursor:pointer}
.row.done .t{color:var(--muted);text-decoration:line-through}
.row .d small{display:block;font-size:11.5px;color:var(--faint)}
.chk{width:20px;height:20px;border:1.5px solid var(--faint);border-radius:5px;background:var(--surface);cursor:pointer;padding:0;display:grid;place-items:center}
.chk:hover{border-color:var(--ok)}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on::after{content:"";width:5px;height:9px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.quick{display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:18px}
.quick input,.quick select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 10px;min-width:0}
.quick #qTitle{flex:1 1 260px}
.quick #qTime{width:118px}
.grp{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 2px;letter-spacing:.03em;display:flex;justify-content:space-between}
.grp:first-child{margin-top:0}
.grp.bad{color:var(--bad)}
.rt{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.rt:first-child{border-top:0}
.rt span{flex:1;min-width:0}
.rt.on span{color:var(--muted);text-decoration:line-through}
.links{display:flex;flex-direction:column}
.links a{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}

  const fs={small:"13.5px",normal:"14.5px",large:"16px"}[u.font]||"14.5px";
  $("#themeStyle").textContent=`:root{${light}--fs:${fs}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${dark}}}:root[data-theme="dark"]{${dark}}`;
  const root=document.documentElement;
  if(u.mode==="light"||u.mode==="dark"){root.dataset.theme=u.mode;themedMode=true}else if(themedMode){delete root.dataset.theme;themedMode=false}

const subInfo=t=>{const c=t.checklist||[];return c.length?`<span class="sub">${c.filter(x=>x.done).length}/${c.length}</span>`:""};
function rowTask(t){
  const p=proj(t.projectId),late=isLate(t),done=isDone(t);const other=t.assignee&&t.assignee!==ME;
  return `<div class="row ${done?"done":""}"><button type="button" class="chk ${done?"on":""}" data-check="${esc(t.id)}" aria-label="${done?"완료 취소":"완료로 표시"}"></button>
   <span class="d ${late?"late":""}">${fmtMD(t.due)}${t.time?`<small>${esc(timeStr(t))}</small>`:""}</span>
   <span class="t" data-task="${esc(t.id)}">${t.important?`<span class="star" aria-label="중요">★</span>`:""}${esc(t.title)}${subInfo(t)}${tagChips(t)}<small>${esc(pname(p))}${hasSpan(t)?" · 기간 "+spanStr(t):""}${other?" · "+esc(t.assignee)+" 담당":""}${t.repeat&&t.repeat.type?" · "+repLabel(t.repeat)+" 반복":""}</small></span>${pill(t)}</div>`;

const sortImp=a=>a.sort((x,y)=>(y.important?1:0)-(x.important?1:0)||byDue(x,y));
async function spawnNext(t){
  const nd=nextDue(t.due||T,t.repeat);const id=newId("t");const ns=hasSpan(t)?ymd(addDays(pd(nd),-Math.round((pd(t.due)-pd(t.start))/864e5))):"";
  await S.db.collection("tasks").doc(id).set({title:t.title,projectId:t.projectId||"",assignee:t.assignee||ME,memo:t.memo||"",time:t.time||"",endTime:t.endTime||"",important:!!t.important,tags:t.tags||[],repeat:t.repeat,checklist:(t.checklist||[]).map(c=>({text:c.text,done:false})),start:ns,due:nd,status:firstOf("open"),createdAt:nowIso(),updatedAt:nowIso()});
  await S.db.doc("tasks/"+t.id).update({nextId:id});
  toast("다음 회차 "+fmtMD(nd)+" 업무를 만들었습니다");
}
function statusPatch(prev,next){const d={status:next};const wasDone=stOf(prev).kind==="done",nowDone=stOf(next).kind==="done";if(nowDone&&!wasDone)d.completedAt=nowIso();if(!nowDone)d.completedAt="";return d}
async function toggleDone(t){
  const opens=STS().filter(s=>s.kind==="open");
  const next=isDone(t)?(opens[1]||opens[0]||{}).key:firstOf("done");if(!next)return;
  try{await S.db.doc("tasks/"+t.id).update({...statusPatch(t.status,next),updatedAt:nowIso()});
    if(stOf(next).kind==="done"){if(t.repeat&&t.repeat.type&&!t.nextId)await spawnNext(t);else toast("완료했습니다")}}catch(e){fail(e)}
}

  const week=op.filter(t=>t.due&&t.due>T&&t.due<=we).sort(byDue);
  const later=op.filter(t=>t.due&&t.due>we).sort(byDue).slice(0,8);
  const nodue=op.filter(t=>!t.due);
  const sched=op.filter(t=>t.time&&t.due&&t.due>=T&&t.due<=ymd(addDays(NOW,21))).sort(byDue);

  const dayCol=d=>{const k=ymd(d),its=sortImp(wkAll.filter(t=>t.due===k)).sort((a,b)=>(isDone(a)?1:0)-(isDone(b)?1:0)||(a.time||"99").localeCompare(b.time||"99"));

  /* 이번 주에 걸친 기간 업무를 요일 칸 위에 시작일~마감일 막대로 표시 */
  const wkSpans=S.tasks.filter(t=>hasSpan(t)&&!isHold(t)&&(isOpen(t)||isDone(t))&&t.start<=we&&t.due>=ws).sort((a,b)=>a.start.localeCompare(b.start)||byDue(a,b));

    const c0=Math.round((pd(a)-pd(ws))/864e5)+1,c1=Math.round((pd(b)-pd(ws))/864e5)+2;const done=isDone(t);
    return `<button type="button" class="sbar ${t.start<ws?"cont-l":""} ${t.due>we?"cont-r":""} ${done?"done":""}" style="grid-column:${c0}/${c1};--pc:${isLate(t)?"var(--c-red)":cvar(stOf(t.status).color)}" data-task="${esc(t.id)}"><span class="nm">${t.important?"★ ":""}${esc(t.title)}</span><small>${esc(spanStr(t))}</small></button>`}).join("")}</div>`:"";

/* 사업 카드: 정식 명칭 + 진행 현황(기간·업무·산출목표) + 다음 할 일 */
function pStat(p){
  const ts=S.tasks.filter(t=>t.projectId===p.id&&!isHold(t));const done=ts.filter(isDone).length,open=ts.filter(isOpen);
  const late=open.filter(isLate).length;const next=[...open].sort(byDue).find(t=>t.due)||open[0]||null;
  let dd="";if(p.end){const left=Math.round((pd(p.end)-pd(T))/864e5);const before=p.start&&p.start>T?Math.round((pd(p.start)-pd(T))/864e5):null;
    dd=before!==null?"시작까지 D-"+before:left<0?"기간 종료":left===0?"오늘 종료":"종료까지 D-"+left}
  return {total:ts.length,done,openN:open.length,late,next,dd,tp:timePct(p),op:outPct(p),tk:ts.length?Math.round(done/ts.length*100):null};
}
const stChip=st=>`<span class="stchip" style="--pc:${st==="진행중"?"var(--run)":st==="종료"?"var(--faint)":"var(--warn)"}">${esc(st||"진행중")}</span>`;
function pCard(p){
  const k=pStat(p);const sh=p.short&&p.short!==p.name?`<span class="pshort">${esc(p.short)}</span>`:"";
  const stat=(lbl,val,pct,cls,sub)=>`<div class="pst"><div class="barlbl"><span>${lbl}</span><span>${val}</span></div><div class="bar ${cls||""}"><i style="width:${pct||0}%"></i></div>${sub?`<small>${sub}</small>`:""}</div>`;
  return `<div class="pcard" data-proj="${esc(p.id)}">
   <div class="top"><div class="pnm"><b>${esc(p.name||pname(p))}</b>${sh}</div><div class="pbadges">${k.late?`<span class="stchip" style="--pc:var(--bad)">지연 ${k.late}</span>`:""}${stChip(p.status)}</div></div>
   <div class="meta">${[p.funder?esc(p.funder):"",p.start?`${p.start.replace(/-/g,".")} ~ ${(p.end||"").replace(/-/g,".")}`:"",k.dd?`<b class="dd">${k.dd}</b>`:""].filter(Boolean).join(" · ")}</div>
   <div class="pstats">
    ${k.tp!==null?stat("사업기간 경과",k.tp+"%",k.tp,"time"):""}
    ${stat("업무 완료",k.total?`${k.done}/${k.total}건`:"업무 없음",k.tk,"",k.total?`남은 업무 ${k.openN}건`:"")}
    ${k.op!==null?stat("산출목표 달성",k.op+"%",k.op,"ok"):""}
   </div>
   <div class="pnext">${k.next?`<span class="muted">다음 할 일</span><span class="nm">${k.next.important?`<span class="star" aria-hidden="true">★</span>`:""}${esc(k.next.title)}</span><span class="${isLate(k.next)?"late":"muted"}">${k.next.due?fmtMD(k.next.due)+(k.next.time?" "+esc(timeStr(k.next)):""):"기한 없음"}</span>`:`<span class="muted">남은 할 일이 없습니다.</span>`}</div></div>`;
}
function outPct(p){const o=(p.outputs||[]).filter(x=>x.target>0);if(!o.length)return null;return Math.round(o.reduce((a,x)=>a+Math.min(1,(x.done||0)/x.target),0)/o.length*100)}
function timePct(p){if(!p.start||!p.end)return null;const a=pd(p.start),b=pd(p.end);return Math.max(0,Math.min(100,Math.round((pd(T)-a)/(b-a)*100)))}

/* ---- 캘린더 ---- */
function vCal(){
  const base=new Date(NOW.getFullYear(),NOW.getMonth()+S.calM,1);const y=base.getFullYear(),mo=base.getMonth();
  const start=addDays(base,-base.getDay());const lastDay=new Date(y,mo+1,0);const end=addDays(lastDay,6-lastDay.getDay());
  const byDay={};const gs=ymd(start),ge=ymd(end);
  S.tasks.forEach(t=>{if(!t.due||isHold(t))return;
    if(!hasSpan(t)){(byDay[t.due]=byDay[t.due]||[]).push(t);return}
    /* 기간 업무는 시작일부터 마감일까지 매일 표시 (보이는 달력 범위만) */
    const from=t.start>gs?t.start:gs,to=t.due<ge?t.due:ge;
    for(let d=pd(from);ymd(d)<=to;d=addDays(d,1)){const k=ymd(d);(byDay[k]=byDay[k]||[]).push(t)}});
  const sel0=S.selDay||T;if(sel0<gs||sel0>ge)S.tasks.forEach(t=>{if(t.due&&!isHold(t)&&hasSpan(t)&&t.start<=sel0&&t.due>sel0)(byDay[sel0]=byDay[sel0]||[]).push(t)});
  /* 기간 업무: 주(행)마다 같은 줄(lane)에 놓아 시작일~마감일을 한 막대로 잇습니다 */
  const chipColor=t=>isLate(t)?"var(--c-red)":cvar(stOf(t.status).color);
  const spans=S.tasks.filter(t=>t.due&&!isHold(t)&&hasSpan(t)&&t.start<=ge&&t.due>=gs);
  let cells="";
  for(let w=new Date(start);w<=end;w=addDays(w,7)){
    const ws0=ymd(w),we0=ymd(addDays(w,6));
    const segs=spans.filter(t=>t.start<=we0&&t.due>=ws0).map(t=>({t,a:t.start>ws0?t.start:ws0,b:t.due<we0?t.due:we0}))
      .sort((x,y)=>x.a.localeCompare(y.a)||y.b.localeCompare(x.b)||byDue(x.t,y.t));
    const lanes=[];segs.forEach(g=>{let l=lanes.findIndex(e=>e<g.a);if(l<0){l=lanes.length;lanes.push("")}lanes[l]=g.b;g.l=l});
    const nL=Math.min(lanes.length,3);
    for(let i=0;i<7;i++){const d=addDays(w,i);
    const k=ymd(d),items=(byDay[k]||[]).sort(byDue),dw=d.getDay();
    const singles=items.filter(t=>!hasSpan(t));const here=segs.filter(g=>g.a<=k&&g.b>=k);
    let rows=[];for(let l=0;l<nL;l++){const g=here.find(x=>x.l===l);
      if(!g){rows.push(`<span class="chip sp" aria-hidden="true"></span>`);continue}
      const t=g.t,first=k===g.a,last=k===g.b;
      rows.push(`<span class="chip cbar${first?" bs":""}${last?" be":""}${isDone(t)?" done":""}" style="--pc:${chipColor(t)}" data-task="${esc(t.id)}" title="${esc(t.title)} (${esc(spanStr(t))})">${first?esc(t.title):"&nbsp;"}</span>`)}
    /* 빈 줄은 뒤에서부터 정리하고, 남는 자리에 하루짜리 업무를 넣습니다 */
    while(rows.length&&rows[rows.length-1].includes(" sp\""))rows.pop();
    const room=Math.max(0,3-rows.length);
    singles.slice(0,room).forEach(t=>rows.push(`<span class="chip ${isDone(t)?"done":""}" style="--pc:${chipColor(t)}" data-task="${esc(t.id)}" title="${esc(t.title)}">${t.time?esc(t.time)+" ":""}${esc(t.title)}</span>`));
    const hidden=items.length-here.filter(g=>g.l<nL).length-Math.min(singles.length,room);
    cells+=`<div class="cday ${d.getMonth()!==mo?"out":""} ${k===T?"today":""} ${k===S.selDay?"sel":""} ${dw===0?"sun":dw===6?"sat":""}" data-day="${k}" role="button" tabindex="0" aria-label="${d.getMonth()+1}월 ${d.getDate()}일, 업무 ${items.length}건">
      <span class="dn">${d.getDate()}</span>
      ${rows.join("")}
      ${hidden>0?`<span class="more">+${hidden}건</span>`:""}
      ${items.length?`<span class="dots">${items.slice(0,5).map(t=>`<i class="${isLate(t)?"late":""}"></i>`).join("")}</span>`:""}</div>`;
    }
  }
  const sel=S.selDay||T;const selItems=(byDay[sel]||[]).sort(byDue);
  return `<div class="head"><div><h1>${esc(mlabel("calendar"))}</h1><p>날짜를 누르면 그날 업무를 보고 바로 추가할 수 있습니다.</p></div><button class="btn pri" data-act="newTask" data-due="${sel}">업무 추가</button></div>
  <div class="weeknav" style="margin-bottom:12px"><button class="btn sm" data-cal="-1" aria-label="이전 달">←</button><h2>${y}년 ${mo+1}월</h2><button class="btn sm" data-cal="1" aria-label="다음 달">→</button>${S.calM!==0?`<button class="btn sm" data-cal="0">이번 달</button>`:""}</div>
  <div style="overflow-x:auto"><div class="cal">${WD.map((w,i)=>`<div class="wd ${i===0?"sun":i===6?"sat":""}">${w}</div>`).join("")}${cells}</div></div>
  <section class="panel" style="margin-top:16px"><header><h2>${fmtMD(sel)}${sel===T?" · 오늘":""}</h2><button class="btn sm" data-act="newTask" data-due="${sel}">이 날에 추가</button></header>
    <div class="list">${selItems.length?selItems.map(rowTask).join(""):`<div class="empty">이 날 마감·일정·진행 중인 업무가 없습니다.</div>`}</div></section>`;
}

/* 시트 연동: Apps Script 웹 앱을 script 태그로 불러옵니다(JSONP). 회사 계정 전용 배포도 로그인돼 있으면 됩니다 */
function sheetJsonp(url,week){return new Promise((ok,no)=>{
  const cb="__wdSheet"+Date.now().toString(36),sc=document.createElement("script");let done=false;
  const end=()=>{done=true;clearTimeout(tm);delete window[cb];sc.remove()};
  const tm=setTimeout(()=>{if(!done){end();no(new Error("응답이 없습니다. 주소가 맞는지, 브라우저가 회사 구글 계정으로 로그인돼 있는지 확인해 주세요"))}},15000);
  window[cb]=d=>{end();ok(d||{})};
  const bad=()=>{if(!done){end();no(new Error("시트에 접근하지 못했습니다. 이 브라우저에 회사 구글 계정(dreammakers.or.kr)으로 로그인돼 있는지 확인해 주세요. 계정이 여러 개면 시크릿 창에서 회사 계정으로만 로그인해 보세요"))}};
  sc.onerror=bad;sc.onload=()=>setTimeout(bad,50);
  sc.src=url+(url.includes("?")?"&":"?")+"week="+encodeURIComponent(week)+"&callback="+cb;document.head.appendChild(sc)})}
function numFmt(style,i){if(style==="가."){const K="가나다라마바사아자차카타파하";return (K[i]||String(i+1))+"."}if(style==="-"||style==="•")return style;return (i+1)+")"}
function genReport(off){
  /* 시트 양식과 같게: 업무 보고 = 지난주(s-7 ~ s-1), 업무 계획 = 이번 주(s ~ s+6) */
  const R=REP();const s=wkStart(off),S1=ymd(addDays(s,-7)),E1=ymd(addDays(s,-1)),E2=ymd(addDays(s,6));
  const mine=t=>!t.assignee||t.assignee===ME;
  const group=f=>{const by={};S.tasks.filter(f).forEach(t=>{const k=t.projectId&&proj(t.projectId)?t.projectId:"";(by[k]=by[k]||[]).push(t)});return by};
  const rep=group(t=>{if(!mine(t)||isHold(t))return false;if(isDone(t)){const c=t.completedAt?ymd(new Date(t.completedAt)):"";return c>=S1&&c<=E1}return stOf(t.status).key===(STS().filter(x=>x.kind==="open")[1]||{}).key||(t.due&&t.due>=S1&&t.due<=E1)});
  const plan=group(t=>mine(t)&&isOpen(t)&&((t.due&&t.due<=E2)||stOf(t.status).key===(STS().filter(x=>x.kind==="open")[1]||{}).key));
  const order=[...S.projects.filter(p=>p.kind!=="영역"),...S.projects.filter(p=>p.kind==="영역")].map(p=>p.id).concat([""]);
  const fmt=(by,mode)=>{const out=[];order.forEach(pid=>{const ts=by[pid];if(!ts||!ts.length)return;const p=proj(pid);out.push(R.bullet+" "+(p?p.name:"기타 업무"));
    ts.sort(byDue).forEach((t,i)=>{let tail="";if(mode==="rep"){if(R.showStatus)tail=isDone(t)?" - 완료":" - "+stOf(t.status).label}else tail=t.due?(hasSpan(t)?" "+spanStr(t):" ~ "+fmtMD(t.due))+(t.time?" "+timeStr(t):""):"";out.push("  "+numFmt(R.num,i)+" "+t.title+tail)});out.push("")});return out};
  const routines=setting("routines").items||[];const rw=(S.rweeks.find(x=>x.id===S1)||{}).done||{};
  const r1=fmt(rep,"rep");const r2=fmt(plan,"plan");
  if(R.routines){const dr=routines.filter(r=>rw[r]);if(dr.length){r1.push(R.bullet+" 정기 업무");dr.forEach((r,i)=>r1.push("  "+numFmt(R.num,i)+" "+r));r1.push("")}
    if(routines.length){r2.push(R.bullet+" 정기 업무");routines.forEach((r,i)=>r2.push("  "+numFmt(R.num,i)+" "+r));r2.push("")}}
  if(R.extra){r1.push(R.bullet+" "+R.extra);r2.push(R.bullet+" "+R.extra)}
  return {report:r1.join("\n"),plan:r2.join("\n")};
}

function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}
async function onPhoto(file){
  try{const url=URL.createObjectURL(file);const img=await loadImg(url);
    const k=Math.min(1,640/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    let orig=c.toDataURL("image/jpeg",0.8);if(orig.length>190000)orig=c.toDataURL("image/jpeg",0.6);
    const fi=$("#photoFile");if(fi)fi.value="";
    cropDlg(orig,null)}catch(e){toast("이 사진을 읽을 수 없습니다. JPG나 PNG 파일로 다시 골라 주세요")}
}
function cropDlg(orig,crop){
  const V=260,st={};
  openDlg("사진 영역 조절",`<div style="display:flex;flex-direction:column;align-items:center;gap:14px">
     <div class="crop" id="cropBox" aria-label="끌어서 사진 위치 조절"><img id="cropImg" alt="" draggable="false"></div>
     <div class="zoomrow"><span class="muted" aria-hidden="true">−</span><input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1" aria-label="확대"><span class="muted" aria-hidden="true">+</span></div>
     <p class="muted" style="margin:0;font-size:12.5px;text-align:center">사진을 끌어서 위치를 맞추고, 막대(또는 마우스 휠)로 크기를 조절하세요.<br>동그라미 안쪽이 프로필 사진이 됩니다.</p></div>`,
   async()=>{if(!st.img)return false;const sc=st.base*st.z;const c=document.createElement("canvas");c.width=c.height=200;
     c.getContext("2d").drawImage(st.img,-st.x/sc,-st.y/sc,V/sc,V/sc,0,0,200,200);
     await saveProfile({photo:c.toDataURL("image/jpeg",0.88),photoOrig:orig,photoCrop:{z:st.z,cx:(V/2-st.x)/sc,cy:(V/2-st.y)/sc},avatar:"upload"});toast("프로필 사진을 저장했습니다")},
   null,
   async()=>{
     const img=await loadImg(orig);st.img=img;const W=img.naturalWidth,H=img.naturalHeight;st.base=Math.max(V/W,V/H);st.z=crop&&crop.z||1;
     let cx=crop?crop.cx:W/2,cy=crop?crop.cy:H/2;
     const el=$("#cropImg"),box=$("#cropBox"),zoom=$("#cropZoom");el.src=orig;el.style.width=W+"px";el.style.height=H+"px";
     const clamp=()=>{const sc=st.base*st.z;st.x=Math.min(0,Math.max(V-W*sc,st.x));st.y=Math.min(0,Math.max(V-H*sc,st.y))};
     const fromCenter=()=>{const sc=st.base*st.z;st.x=V/2-cx*sc;st.y=V/2-cy*sc;clamp()};
     const toCenter=()=>{const sc=st.base*st.z;cx=(V/2-st.x)/sc;cy=(V/2-st.y)/sc};
     const draw=()=>{el.style.transform=`translate(${st.x}px,${st.y}px) scale(${st.base*st.z})`};
     fromCenter();draw();zoom.value=st.z;
     zoom.oninput=()=>{toCenter();st.z=+zoom.value;fromCenter();draw()};
     box.onwheel=e=>{e.preventDefault();zoom.value=Math.min(4,Math.max(1,st.z-e.deltaY*0.002));zoom.oninput()};
     let drag=null;
     box.onpointerdown=e=>{drag={px:e.clientX,py:e.clientY,x:st.x,y:st.y};box.setPointerCapture(e.pointerId);box.classList.add("drag")};
     box.onpointermove=e=>{if(!drag)return;const r=box.getBoundingClientRect(),k=V/r.width;st.x=drag.x+(e.clientX-drag.px)*k;st.y=drag.y+(e.clientY-drag.py)*k;clamp();draw()};
     box.onpointerup=box.onpointercancel=()=>{drag=null;box.classList.remove("drag")};
   });
}

    return}
  if(e.target.id==="quickForm"){e.preventDefault();const title=$("#qTitle").value.trim();if(!title)return;
    const d={title,due:$("#qDue").value,time:$("#qTime").value,projectId:$("#qProj").value,status:firstOf("open"),assignee:ME,memo:"",createdAt:nowIso(),updatedAt:nowIso()};
    try{await S.db.collection("tasks").doc(newId("t")).set(d);$("#qTitle").value="";$("#qDue").value="";$("#qTime").value="";toast("추가했습니다")}catch(err){fail(err)}return}
  if(e.target.id==="composeForm"){e.preventDefault();const text=$("#cText").value.trim();if(!text)return;
    try{await S.db.collection("posts").doc(newId("s")).set({kind:$("#cKind").value,projectId:$("#cProj").value,text,createdAt:nowIso()});$("#cText").value="";toast("기록했습니다")}catch(err){fail(err)}}
});

/* ---- 시작 ---- */
route();
const to=setTimeout(()=>{if(!S.db){S.err="저장소에 연결하지 못했습니다. 인터넷 연결을 확인하고 페이지를 다시 열어 주세요.";render()}},10000);
(async()=>{
  try{
    const [db,dl,user]=await Promise.all([window.claude.use("db"),window.claude.use("downloads"),window.claude.use("user")]);
    if(user){try{const me=await user.me();S.acct={name:me.name||"",avatarUrl:me.avatarUrl}}catch(e){}}
    if(!db){clearTimeout(to);S.err="저장소를 사용할 수 없습니다. 다시 로그인해 주세요.";render();return}
    S.db=db;S.dl=dl;
    COLS.forEach(col=>db.collection(col).onSnapshot(snap=>{clearTimeout(to);S[col]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded[col]=1;render()},()=>{clearTimeout(to);S.loaded[col]=1;toast("일부 데이터를 불러오지 못했습니다.");render()}));
  }catch(e){clearTimeout(to);S.err="저장소 연결 중 문제가 생겼습니다.";render()}
})();
})();
</script>
<script>
/* ---- 로그인 + Firebase 저장소 연결 ----
   각 사용자의 데이터는 users/{uid}/... 아래에 따로 저장됩니다.
   FIREBASE_CONFIG 가 비어 있으면 예전처럼 이 브라우저에만 저장(로그인 없음)합니다. */
(function(){
  var MAX_USERS = 10;
  var MAX_NAME = 10;
  var DOMAIN = "@work-dashboard.app";
  var cfg = window.FIREBASE_CONFIG || {};
  var useFirebase = !!(cfg.apiKey && cfg.projectId && window.firebase);

  function startApp(){
    var src = document.getElementById("appMain");
    if (!src || src.dataset.started) return;
    src.dataset.started = "1";
    var s = document.createElement("script");
    s.textContent = src.textContent;
    document.body.appendChild(s);
  }
  function downloadsApi(){
    return { save: function(o){
      var blob = new Blob([o.data], { type: "application/json" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = o.filename || "backup.json";
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      return Promise.resolve();
    } };
  }

  /* ---------- 설정이 없을 때: 이 브라우저에만 저장 ---------- */
  function localDb(){
    var KEY = "work-dashboard-db-v1", mem = {}, subs = {};
    function load(){ try { return JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e){ return mem; } }
    function save(d){ mem = d; try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e){} }
    function snap(col){ var d = load()[col] || {}; return { docs: Object.keys(d).map(function(id){ return { id: id, data: function(){ return JSON.parse(JSON.stringify(d[id])); } }; }) }; }
    function emit(col){ (subs[col] || []).forEach(function(cb){ try { cb(snap(col)); } catch(e){ console.error(e); } }); }
    function ref(col, id){
      function mut(fn){ var d = load(); d[col] = d[col] || {}; fn(d[col]); save(d); setTimeout(function(){ emit(col); }, 0); return Promise.resolve(); }
      return { id: id,
        set: function(v){ return mut(function(c){ c[id] = JSON.parse(JSON.stringify(v)); }); },
        update: function(v){ var d = load(); if (!d[col] || !d[col][id]) return Promise.reject(new Error("문서가 없습니다")); return mut(function(c){ Object.assign(c[id], JSON.parse(JSON.stringify(v))); }); },
        delete: function(){ return mut(function(c){ delete c[id]; }); } };
    }
    window.addEventListener("storage", function(e){ if (e.key === KEY) Object.keys(subs).forEach(emit); });
    return {
      collection: function(col){ return { doc: function(id){ return ref(col, id); },
        onSnapshot: function(cb){ (subs[col] = subs[col] || []).push(cb); setTimeout(function(){ cb(snap(col)); }, 0); return function(){}; } }; },
      doc: function(p){ var i = p.indexOf("/"); return ref(p.slice(0, i), p.slice(i + 1)); }
    };
  }

  if (!useFirebase) {
    var ldb = localDb();
    window.claude = { use: function(n){ return Promise.resolve(n === "db" ? ldb : n === "downloads" ? downloadsApi() : null); } };
    startApp();
    return;
  }

  /* ---------- Firebase ---------- */
  firebase.initializeApp(cfg);
  var auth = firebase.auth();
  var fs = firebase.firestore();
  try { fs.settings({ ignoreUndefinedProperties: true, merge: true }); } catch(e){}
  try { fs.enablePersistence({ synchronizeTabs: true }).catch(function(){}); } catch(e){}
  var REG = fs.collection("meta").doc("registry");

  function normName(n){ return String(n || "").normalize("NFC").trim().replace(/\s+/g, " "); }
  function nameToEmail(n){
    var bytes = new TextEncoder().encode(normName(n).toLowerCase()), hex = "";
    bytes.forEach(function(b){ hex += b.toString(16).padStart(2, "0"); });
    return "u" + hex + DOMAIN;
  }
  function userDb(uid){
    var root = fs.collection("users").doc(uid);
    return {
      collection: function(c){ var col = root.collection(c); return { doc: function(id){ return col.doc(id); }, onSnapshot: function(a, b){ return col.onSnapshot(a, b); } }; },
      doc: function(p){ var i = p.indexOf("/"); return root.collection(p.slice(0, i)).doc(p.slice(i + 1)); }
    };
  }
  function errMsg(e){
    var c = (e && e.code) || "";
    if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return "이름 또는 비밀번호가 맞지 않습니다.";
    if (/email-already-in-use/.test(c)) return "이미 같은 이름의 계정이 있습니다. 로그인하거나 다른 이름을 써 주세요.";
    if (/weak-password/.test(c)) return "비밀번호는 6자 이상이어야 합니다.";
    if (/too-many-requests/.test(c)) return "시도가 너무 많습니다. 잠시 후 다시 해 주세요.";
    if (/network-request-failed|unavailable/.test(c)) return "인터넷 연결을 확인해 주세요.";
    if (/operation-not-allowed/.test(c)) return "Firebase에서 '이메일/비밀번호' 로그인이 꺼져 있습니다. 관리자에게 알려 주세요.";
    if (/permission-denied/.test(c)) return "권한이 없습니다. 관리자에게 Firestore 규칙 설정을 확인해 달라고 해 주세요.";
    if (e && e.message === "LIMIT") return "정원(" + MAX_USERS + "명)이 다 찼습니다. 관리자에게 문의해 주세요.";
    if (e && e.message === "NOT_MEMBER") return "등록이 해제된 계정입니다. 관리자에게 문의해 주세요.";
    return "문제가 생겼습니다. 다시 시도해 주세요." + (c ? " (" + c + ")" : "");
  }

  /* ---------- 로그인 화면 ---------- */
  var css = document.createElement("style");
  css.textContent = [
    "#authGate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:var(--bg,#f3f5f6);overflow:auto}",
    "#authGate[hidden]{display:none}",
    "#authGate .box{width:min(380px,100%);background:var(--surface,#fff);border:1px solid var(--line,#d5dde1);border-radius:12px;padding:26px 24px;box-shadow:0 10px 30px rgba(0,0,0,.06)}",
    "#authGate h1{margin:0 0 4px;font-size:22px;color:var(--ink,#1c2b33)}",
    "#authGate .sub{margin:0 0 18px;color:var(--muted,#5d6f78);font-size:13.5px}",
    "#authGate .tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk,#e9eef0);border-radius:8px;padding:3px;margin-bottom:16px}",
    "#authGate .tabs button{border:0;background:transparent;padding:9px;border-radius:6px;font:inherit;font-weight:600;color:var(--muted,#5d6f78);cursor:pointer}",
    "#authGate .tabs button.on{background:var(--surface,#fff);color:var(--ink,#1c2b33);box-shadow:0 1px 3px rgba(0,0,0,.08)}",
    "#authGate form{display:flex;flex-direction:column;gap:12px}",
    "#authGate label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted,#5d6f78)}",
    "#authGate input{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line,#d5dde1);border-radius:8px;background:var(--surface,#fff);color:var(--ink,#1c2b33)}",
    "#authGate input:focus{outline:2px solid var(--brand,#1f4e5f);outline-offset:-1px}",
    "#authGate .go{margin-top:4px;border:0;border-radius:8px;padding:12px;font:inherit;font-weight:700;background:var(--brand,#1f4e5f);color:var(--brand-ink,#fff);cursor:pointer}",
    "#authGate .go:disabled{opacity:.6;cursor:wait}",
    "#authGate .msg{min-height:18px;font-size:13px;color:var(--bad,#b4372f);margin:0}",
    "#authGate .msg.ok{color:var(--ok,#2f7d4f)}",
    "#authGate .hint{font-size:12px;color:var(--faint,#8a9aa2);margin:2px 0 0}",
    "#authGate .cancel{border:0;background:none;color:var(--muted,#5d6f78);font:inherit;font-size:13px;cursor:pointer;padding:6px}",
    ".acctBar{margin-left:auto;display:flex;gap:6px;align-items:center}",
    ".acctBar button{border:1px solid color-mix(in srgb,var(--brand-ink,#fff) 35%,transparent);background:transparent;color:inherit;border-radius:6px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer;opacity:.9;white-space:nowrap}",
    ".acctBar button:hover{opacity:1;background:color-mix(in srgb,var(--brand-ink,#fff) 12%,transparent)}",
    "@media (min-width:761px){.rail .acctBar{order:9;margin:0}}",
    "@media (max-width:760px){.rail .mark{display:flex;align-items:center;gap:8px}.rail .mark .acctBar{flex:none;display:flex;flex-direction:row;gap:6px}.acctBar button{min-height:0!important;padding:5px 9px}}"
  ].join("\n");
  document.head.appendChild(css);

  var gate = document.createElement("div");
  gate.id = "authGate";
  document.body.appendChild(gate);
  var mode = "login";

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
  function drawGate(msg, ok){
    var signup = mode === "signup", pw = mode === "pw";
    gate.hidden = false;
    gate.innerHTML = '<div class="box">' +
      '<h1>' + (pw ? "비밀번호 변경" : "업무 대시보드") + '</h1>' +
      '<p class="sub">' + (pw ? "지금 비밀번호를 확인한 뒤 새 비밀번호로 바꿉니다." : signup ? "이름과 비밀번호만 정하면 바로 쓸 수 있어요. 최대 " + MAX_USERS + "명까지 만들 수 있습니다." : "이름과 비밀번호로 로그인하세요.") + '</p>' +
      (pw ? "" : '<div class="tabs"><button type="button" data-m="login" class="' + (signup ? "" : "on") + '">로그인</button><button type="button" data-m="signup" class="' + (signup ? "on" : "") + '">계정 만들기</button></div>') +
      '<form id="authForm" novalidate>' +
      (pw ? '<label>지금 비밀번호<input id="aCur" type="password" autocomplete="current-password" required></label>' +
            '<label>새 비밀번호<input id="aPw" type="password" autocomplete="new-password" minlength="6" required></label>' +
            '<label>새 비밀번호 확인<input id="aPw2" type="password" autocomplete="new-password" required></label>'
          : '<label>이름<input id="aName" autocomplete="username" maxlength="' + MAX_NAME + '" required placeholder="예: 홍길동"></label>' +
            '<label>비밀번호<input id="aPw" type="password" autocomplete="' + (signup ? "new-password" : "current-password") + '" required></label>' +
            (signup ? '<label>비밀번호 확인<input id="aPw2" type="password" autocomplete="new-password" required></label><p class="hint">비밀번호는 6자 이상. 잊어버리면 찾을 수 없으니 꼭 기억해 두세요.</p>' : "")) +
      '<p class="msg' + (ok ? " ok" : "") + '" id="aMsg">' + (msg ? esc(msg) : "") + '</p>' +
      '<button class="go" id="aGo">' + (pw ? "변경하기" : signup ? "계정 만들고 시작하기" : "로그인") + '</button>' +
      (pw ? '<button type="button" class="cancel" data-m="cancel">취소</button>' : "") +
      '</form></div>';
    var f = gate.querySelector(pw ? "#aCur" : "#aName"); if (f) f.focus();
  }
  function setMsg(t, ok){ var m = document.getElementById("aMsg"); if (m){ m.textContent = t || ""; m.className = "msg" + (ok ? " ok" : ""); } }
  function busy(b){ var g = document.getElementById("aGo"); if (g) g.disabled = b; }

  gate.addEventListener("click", function(e){
    var b = e.target.closest("[data-m]"); if (!b) return;
    if (b.dataset.m === "cancel"){ gate.hidden = true; mode = "login"; return; }
    mode = b.dataset.m; drawGate();
  });

  gate.addEventListener("submit", async function(e){
    e.preventDefault();
    var pwEl = document.getElementById("aPw"), pw2El = document.getElementById("aPw2");
    var pw = pwEl ? pwEl.value : "";
    if (mode === "pw"){
      var cur = document.getElementById("aCur").value;
      if (pw.length < 6) return setMsg("새 비밀번호는 6자 이상이어야 합니다.");
      if (pw !== pw2El.value) return setMsg("새 비밀번호가 서로 다릅니다.");
      busy(true);
      try {
        var u = auth.currentUser;
        await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, cur));
        await u.updatePassword(pw);
        setMsg("비밀번호를 바꿨습니다.", true);
        setTimeout(function(){ gate.hidden = true; mode = "login"; }, 900);
      } catch(err){ setMsg(errMsg(err)); }
      busy(false); return;
    }
    var name = normName(document.getElementById("aName").value);
    if (!name) return setMsg("이름을 입력해 주세요.");
    if (name.length > MAX_NAME) return setMsg("이름은 " + MAX_NAME + "자 이내로 입력해 주세요.");
    if (!pw) return setMsg("비밀번호를 입력해 주세요.");
    busy(true); setMsg("");
    try {
      if (mode === "signup"){
        if (pw.length < 6) { busy(false); return setMsg("비밀번호는 6자 이상이어야 합니다."); }
        if (pw !== pw2El.value) { busy(false); return setMsg("비밀번호가 서로 다릅니다."); }
        signingUp = true;
        var cred = await auth.createUserWithEmailAndPassword(nameToEmail(name), pw);
        var uid = cred.user.uid;
        try {
          await fs.runTransaction(async function(tx){
            var snap = await tx.get(REG);
            var members = (snap.exists && snap.data().members) || {};
            if (!members[uid] && Object.keys(members).length >= MAX_USERS) throw new Error("LIMIT");
            if (snap.exists) tx.update(REG, new firebase.firestore.FieldPath("members", uid), name);
            else tx.set(REG, { members: (function(){ var m = {}; m[uid] = name; return m; })() });
          });
        } catch(err){
          try { await cred.user.delete(); } catch(_){ await auth.signOut(); }
          signingUp = false; throw err;
        }
        try { await cred.user.updateProfile({ displayName: name }); } catch(_){}
        try { await userDb(uid).doc("settings/profile").set({ data: { name: name } }); } catch(_){}
        signingUp = false;
        await enter(cred.user);
      } else {
        await auth.signInWithEmailAndPassword(nameToEmail(name), pw);
      }
    } catch(err){ signingUp = false; setMsg(errMsg(err)); busy(false); }
  });

  var started = false, signingUp = false;
  async function enter(user){
    if (started) return;
    if (!auth.currentUser || auth.currentUser.uid !== user.uid) return; /* 이미 지워졌거나 바뀐 계정 */
    var name = user.displayName || "";
    try {
      var reg = await REG.get();
      var members = (reg.exists && reg.data().members) || {};
      if (!members[user.uid]) throw new Error("NOT_MEMBER");
      name = members[user.uid] || name;
    } catch(err){
      if (!auth.currentUser || auth.currentUser.uid !== user.uid) return;
      formShown = true; await auth.signOut(); mode = "login"; drawGate(errMsg(err)); return;
    }
    started = true;
    window.__WD_USER = { uid: user.uid, name: name };
    window.__WD_verifyPw = async function(pw){
      var u = auth.currentUser; if (!u) throw new Error("로그인이 풀렸습니다. 다시 로그인해 주세요.");
      try { await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, pw)); }
      catch(err){ throw new Error(/invalid-credential|wrong-password|invalid-login/.test((err && err.code) || "") ? "비밀번호가 맞지 않습니다." : errMsg(err)); }
    };
    var db = userDb(user.uid);
    var acct = { me: function(){ return Promise.resolve({ name: name, avatarUrl: "" }); } };
    window.claude = { use: function(n){ return Promise.resolve(n === "db" ? db : n === "downloads" ? downloadsApi() : n === "user" ? acct : null); } };
    gate.hidden = true;
    addAcctBar(name);
    startApp();
  }
  function addAcctBar(name){
    var mark = document.querySelector(".rail .mark"); if (!mark || document.querySelector(".acctBar")) return;
    var bar = document.createElement("div"); bar.className = "acctBar";
    bar.innerHTML = '<button type="button" data-auth="pw" title="' + esc(name) + ' 계정">비밀번호</button><button type="button" data-auth="logout">로그아웃</button>';
    if (window.matchMedia("(max-width:760px)").matches) mark.appendChild(bar);
    else document.querySelector(".rail").appendChild(bar);
  }
  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-auth]"); if (!b) return;
    if (b.dataset.auth === "logout"){ auth.signOut().then(function(){ location.hash = ""; location.reload(); }); }
    if (b.dataset.auth === "pw"){ mode = "pw"; drawGate(); }
  });

  gate.hidden = false;
  gate.innerHTML = '<div class="box"><h1>업무 대시보드</h1><p class="sub" style="margin:0">로그인 상태를 확인하는 중…</p></div>';
  var formShown = false;
  auth.onAuthStateChanged(function(user){
    if (user){ if (!signingUp) enter(user); }
    else if (!started && !formShown){ formShown = true; mode = "login"; drawGate(); }
  });
})();
</script>
